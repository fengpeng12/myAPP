name: Build APK (manual toolchain, no Gradle)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/build-tools" || true
          ls "$ANDROID_HOME/platforms" || true

      - name: Install Kotlin compiler
        run: |
          curl -sSLo kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q kotlin.zip
          echo "$PWD/kotlinc/bin" >> $GITHUB_PATH

      - name: Build with aapt2 + kotlinc + d8 + apksigner
        run: bash scripts/build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app-debug.apk
